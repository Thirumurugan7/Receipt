<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Receipt — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /*
   * One family, four weights. Every frame of this film is machine output --
   * a transcript, a verdict, a hash -- and the claim being made is that a
   * machine decided it and anyone can re-run it. A display face would soften
   * exactly the thing the film is arguing, so hierarchy comes from size,
   * weight and letterspacing instead.
   *
   * Nothing here animates. The film is a pure function of time: seek(ms)
   * computes every pixel of state from the clock, so frames can be rendered
   * offscreen in any order, on any machine, and come out identical.
   */
  :root{
    --paper:#faf7f2; --ink:#191d2b; --faded:#6b7486; --rule:#e2d9cc; --hair:#efe9e0;
    --carbon:#2f3aa8; --carbon-soft:#eceefb;
    --held:#c2740b; --paid:#13894f; --returned:#cf2f24;
    --term-bg:#14171f; --term-fg:#dfe4ee; --term-dim:#7c879d;
    --gutter:150px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; overflow:hidden}
  body{
    background:var(--paper); color:var(--ink);
    font:400 17px/1.5 "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  }

  #stage{position:relative; width:100vw; height:100vh}
  .scene{position:absolute; inset:0; display:none; flex-direction:column; justify-content:center;
         padding:70px 90px 70px var(--gutter)}
  .scene.dark{justify-content:flex-start}
  .scene.on{display:flex}
  .scene.dark{background:var(--term-bg); color:var(--term-fg)}
  .inner{will-change:transform}

  /* the margin rail: a ledger's left margin, carrying where you are and what
     the escrow is doing. it encodes state, it is not decoration. */
  #rail{position:absolute; left:0; top:0; bottom:0; width:var(--gutter); z-index:4;
        padding:70px 0 70px 44px; display:flex; flex-direction:column; justify-content:space-between}
  #rail:before{content:''; position:absolute; left:26px; top:0; bottom:0;
               border-left:1px dotted var(--rule)}
  body[data-dark="1"] #rail:before{border-left-color:#39405a}
  #rail .num{font-size:15px; font-weight:600; letter-spacing:.06em; color:var(--faded)}
  #rail .nm{font-size:13px; color:var(--faded); margin-top:7px; letter-spacing:.04em}
  #rail .clock{font-size:13px; color:var(--faded)}
  body[data-dark="1"] #rail .num,
  body[data-dark="1"] #rail .nm,
  body[data-dark="1"] #rail .clock{color:#69748f}
  .chip{display:inline-block; max-width:82px; transform-origin:left center; margin-bottom:16px; padding:5px 8px 4px; font-size:11.5px;
        font-weight:600; letter-spacing:.09em; line-height:1.4; border:1.5px solid currentColor}
  .chip.open{color:var(--held)} .chip.rel{color:var(--paid)} .chip.ref{color:var(--returned)}

  h1{font-size:82px; font-weight:700; letter-spacing:.30em; text-indent:.30em; line-height:1}
  h2{font-size:41px; font-weight:600; line-height:1.2; max-width:25ch; letter-spacing:-.005em}
  h2.wide{max-width:36ch}
  h3{font-size:26px; font-weight:600; line-height:1.3; max-width:44ch}
  .lede{color:var(--faded); font-size:20px; margin-top:20px; max-width:62ch; line-height:1.55}
  .huge{font-size:64px; font-weight:700; letter-spacing:-.02em}

  ul{list-style:none; margin-top:30px; display:grid; gap:14px; max-width:78ch}
  li{display:flex; gap:16px; font-size:19.5px; line-height:1.45; align-items:baseline}
  li b{font-weight:700; color:var(--carbon)}
  li .m{color:var(--carbon); flex:0 0 auto; font-weight:700}
  .punch{margin-top:34px; font-size:26px; font-weight:600; color:var(--returned)}

  .stamp{display:inline-block; padding:9px 22px 8px; border:3px solid currentColor;
         font-size:24px; font-weight:700; letter-spacing:.15em; text-indent:.15em;
         text-transform:uppercase; transform-origin:center}
  .stamp.paid{color:var(--paid)} .stamp.returned{color:var(--returned)} .stamp.held{color:var(--held)}

  /* terminal */
  .term{white-space:pre-wrap; word-break:break-word; line-height:1.62; letter-spacing:.002em}
  .term .dim{color:var(--term-dim)} .term .g{color:#5ed99b} .term .r{color:#ff8d80}
  .term .y{color:#f2c069} .term .w{color:#fff; font-weight:500}
  .term .hot{color:#5ef0a6; font-weight:600}
  /* The line currently being printed rides a little brighter than the ones
     behind it, so the eye follows the output instead of re-reading the top.
     A filter rather than a colour, so it lifts the syntax colours with it. */
  .term .live{filter:brightness(1.55)}
  .term{transform-origin:top left}

  /* filled in from seek(): a sweep across the line the scene is about */
  .term .w{background-image:linear-gradient(90deg, rgba(94,217,155,.20), rgba(94,217,155,.20));
           background-repeat:no-repeat; background-size:var(--sweep,0%) 100%}
  .term .r.w{background-image:linear-gradient(90deg, rgba(255,141,128,.20), rgba(255,141,128,.20))}
  .term .warn{color:#f2c069; font-weight:600}
  .slug{color:var(--term-dim); font-size:15.5px; margin-bottom:18px; letter-spacing:.02em}
  .slug b{color:#f2c069; font-weight:500}
  .cur{display:inline-block; width:9px; height:17px; background:var(--term-fg); vertical-align:-3px}

  /* the checklist: the verdict, drawn */
  .checks{margin-top:26px; display:grid; gap:0; max-width:96ch; font-size:20px}
  .checks .row{display:grid; grid-template-columns:34px 224px 104px 1fr; align-items:baseline;
               padding:9px 0; border-bottom:1px dotted var(--hair)}
  .checks .mk{font-weight:700; font-size:19px}
  .checks .nm{font-weight:500}
  .checks .vd{font-weight:600; letter-spacing:.04em}
  .checks .dt{color:var(--faded); font-size:15.5px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
  .checks .row.p .mk,.checks .row.p .vd{color:var(--paid)}
  .checks .row.f .mk,.checks .row.f .vd{color:var(--returned)}
  .checks .row.att{border-bottom:none; margin-top:10px; opacity:.72}
  .checks .row.att .mk,.checks .row.att .vd{color:var(--faded)}

  /* the money line */
  .ledger{margin-top:30px; display:grid; gap:9px; max-width:52ch; font-size:19px}
  .ledger div{display:flex; justify-content:space-between; border-bottom:1px dotted var(--hair); padding-bottom:8px}
  .ledger .tot{border-bottom:none; font-weight:700; font-size:25px; padding-top:4px}

  .flow{display:grid; gap:11px; margin-top:26px; font-size:18.5px; max-width:86ch; line-height:1.45}
  .flow .b{border:1.5px solid #cfd4ee; border-left:4px solid var(--carbon); padding:13px 17px}
  .flow .b.hot{border-color:#eccf9f; border-left-color:var(--held); background:#fdf7ec}
  .flow .a{color:var(--faded); padding-left:24px; font-size:16px}

  table{border-collapse:collapse; margin-top:22px; font-size:17px; width:100%; max-width:1430px}
  th,td{text-align:left; padding:10px 14px 10px 0; border-bottom:1px dotted var(--hair); vertical-align:top}
  th{color:var(--faded); font-weight:400; font-size:14.5px; letter-spacing:.05em}
  td.who{font-weight:700; white-space:nowrap; padding-right:26px}
  td.ev{color:var(--faded); font-size:15px; white-space:nowrap}
  .ok{color:var(--paid)} .nope{color:var(--returned)}

  /* architecture: what each piece does, and what it is built on */
  .arch2{margin-top:20px; max-width:1560px}
  .arow{display:grid; grid-template-columns:30px 168px 1fr 158px; gap:16px; align-items:baseline;
        padding:8px 0; border-bottom:1px dotted var(--hair)}
  .arow .n{color:var(--carbon); font-weight:700; font-size:14px}
  .arow .nm{font-weight:700; font-size:16.5px; letter-spacing:.02em}
  .arow .what{font-size:16px; color:var(--ink); line-height:1.4}
  .arow .tech{font-size:14px; font-weight:600; text-align:right; white-space:nowrap}
  .arow .tech.s{color:var(--carbon)}
  .arow .tech.none{color:var(--rule); font-weight:400}

  /* evidence: real captures of the explorer, shown at size */
  /* the captures are 1500x1000; the box keeps that ratio so nothing is
     squashed and nothing overflows onto the caption. */
  .shot{position:relative; width:1140px; height:730px}
  /* only the pictures are clipped; the caption lives outside the frame */
  .shot .frame{position:absolute; inset:0; overflow:hidden; border-radius:3px}
  .shot img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
            object-position:top center; border:1px solid var(--rule);
            border-radius:3px; box-shadow:0 2px 10px rgba(25,29,43,.10);
            transform-origin:center center}
  .shot .cap{position:absolute; left:0; right:0; bottom:-40px; font-size:16.5px; color:var(--faded)}
  .shot .cap b{color:var(--carbon); font-weight:600}

  #bar{position:absolute; left:0; bottom:0; height:3px; background:var(--carbon); width:0; z-index:6}
</style>
</head>
<body>
<script src="demo-data.js"></script>
<div id="stage"></div>
<div id="rail"><div><div class="num"></div><div class="nm"></div></div>
<div><div class="state"></div><div class="clock"></div></div></div>
<div id="bar"></div>

<script>
const D = window.DEMO_DATA || {};
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
/* A little overshoot, so things arrive rather than merely appear. */
const easeBack = (x) => {
  const u = clamp(x, 0, 1), c = 1.7;
  return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2);
};
const easeInOut = (x) => {
  const u = clamp(x, 0, 1);
  return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
};

/** Colour a captured transcript so the eye lands where the argument is. */
function paint(text){
  return esc(text)
    .replace(/^(.*verdict\s+pass.*)$/gm, '<span class="g w">$1</span>')
    .replace(/^(.*verdict\s+fail.*)$/gm, '<span class="r w">$1</span>')
    .replace(/\bMATCH\b/g, '<span class="hot">MATCH</span>')
    .replace(/\bDECLINED\b/g, '<span class="warn">DECLINED</span>')
    .replace(/\b(ALL \d+ VERDICTS REPRODUCE)\b/g, '<span class="hot">$1</span>')
    .replace(/\b(agree)\b/g, '<span class="g">$1</span>')
    .replace(/\b(ok)\b/g, '<span class="g">$1</span>')
    .replace(/\b(pass|released)\b/g, '<span class="g">$1</span>')
    .replace(/\b(fail|refunded)\b/g, '<span class="r">$1</span>')
    .replace(/(-0\.50000000 ℏ)/g, '<span class="y">$1</span>')
    .replace(/(\b0\.00000000 ℏ)/g, '<span class="g w">$1</span>')
    .replace(/^(\s*[a-zA-Z0-9_()\/\[\]. -]{3,28})(\s{2,})/gm, '<span class="dim">$1</span>$2');
}

/** Fit a transcript to the frame: long ones set smaller rather than overflow. */
function termSize(text){
  const lines = String(text ?? '').split('\n').length;
  return clamp(Math.floor((900 / (lines * 1.62)) * 10) / 10, 11, 17.5);
}

const termScene = (n, slug, key, chip, flip) => ({
  n, dark: true, type: key, chip, flip, enter: 'push',
  html: `<p class="slug">${slug}</p><div class="term" data-k="${key}" style="font-size:${termSize(D[key])}px"></div>`,
});

/** The checklist is drawn from the verdict the adjudicator actually produced. */
function checkRows(v){
  if (!v) return '<p class="lede">(no verdict captured)</p>';
  const rows = v.reproducible.map((c) => {
    const cls = c.pass ? 'p' : 'f';
    const mark = c.pass ? '✓' : '✗';
    const detail = c.skipped ? 'not required by these terms' : (c.detail ?? '');
    return `<div class="row ${cls}" data-reveal><span class="mk">${mark}</span><span class="nm">${esc(c.check)}</span>` +
           `<span class="vd">${c.pass ? 'pass' : 'fail'}</span><span class="dt">${esc(detail)}</span></div>`;
  });
  const a = v.attested?.[0];
  if (a) {
    rows.push(`<div class="row att" data-reveal><span class="mk">·</span><span class="nm">${esc(a.check)}</span>` +
      `<span class="vd">${a.observed}ms</span><span class="dt">attested, not reproducible — gates nothing</span></div>`);
  }
  return `<div class="checks">${rows.join('')}</div>`;
}

/**
 * Frames of a real session on the live ledger, captured by demo/interact.mjs:
 * the button pressed, the transcript streaming, each transaction link landing,
 * and then the explorer page for that exact transaction. Preloaded as elements
 * rather than swapped into one src, so a frame can never be captured mid-load.
 * A test keeps this count honest against the directory.
 */
const RUN_FRAMES = 86;
const runFrames = Array.from({ length: RUN_FRAMES }, (_, i) =>
  `<img data-run="${i}" src="shots/run/f${String(i).padStart(3, '0')}.jpg" alt="">`).join('');

const SCENES = [

{ n:'title', dur:9000, enter:'cut', html:`
  <div style="text-align:center; padding-right:60px">
    <h1><span data-in="120" style="display:inline-block">R</span><span data-in="190" style="display:inline-block">E</span><span data-in="260" style="display:inline-block">C</span><span data-in="330" style="display:inline-block">E</span><span data-in="400" style="display:inline-block">I</span><span data-in="470" style="display:inline-block">P</span><span data-in="540" style="display:inline-block">T</span></h1>
    <p class="lede" data-in="820" style="margin:30px auto 0; max-width:56ch; color:var(--ink); font-size:23px">
      Conditional settlement for x402. The money moves only if the response passes checks the buyer wrote.</p>
    <p data-in="1450" style="margin-top:34px; color:var(--faded); font-size:16px; line-height:2">
      live on Hedera testnet &nbsp;escrow 0x3483B376…4071 &nbsp;audit topic 0.0.10495465<br>
      every figure in this film came off a real run</p>
  </div>`},

{ n:'problem', dur:15000, enter:'rise', html:`
  <h2 class="wide">An agent pays. The API returns HTTP 200 and garbage. The money is already gone.</h2>
  <ul>
    <li data-in="750"><span class="m">—</span><span>x402 has <b>no refund primitive</b>. There is no dispute step anywhere in the stack.</span></li>
    <li data-in="1370"><span class="m">—</span><span>The median ticket is about <b>$0.46</b>. Kleros and UMA want bonds, liveness windows and gas — dollars and days.</span></li>
    <li data-in="1990"><span class="m">—</span><span>Google AP2 and ERC-8004 stop at <b>evidence</b>. Both hand the remedy back to whatever rail you are on.</span></li>
    <li data-in="2610"><span class="m">—</span><span>The one shipped alternative appoints an <b>evaluator</b>: 12M cumulative memos, and <b>five unique senders a day</b>.</span></li>
  </ul>
  <p class="punch" data-in="3600">The evaluator is what broke it. Who judges? Who pays the judge?</p>`},

{ n:'architecture', dur:22000, revealMs:1250, html:`
  <h3 style="max-width:82ch">Receipt has no judge. Here is every piece, and what it is built on.</h3>
  <div class="arch2">
    <div class="arow" data-reveal><span class="n">01</span><span class="nm">BUYER</span><span class="what">Signs Terms with EIP-712 — the exact shape of data it will pay for, before any money moves.</span><span class="tech s">x402</span></div>
    <div class="arow" data-reveal><span class="n">02</span><span class="nm">RECEIPT</span><span class="what">A drop-in facilitator. The seller points its x402 middleware at this URL and changes nothing else.</span><span class="tech none">this project</span></div>
    <div class="arow" data-reveal><span class="n">03</span><span class="nm">SETTLEMENT</span><span class="what">Performs the real payment. The buyer signs a <b>partial</b> transfer and pays no gas.</span><span class="tech s">Blocky402</span></div>
    <div class="arow" data-reveal><span class="n">04</span><span class="nm">ESCROW</span><span class="what">Holds the HBAR between payment and verdict, and verifies the buyer&rsquo;s signature on-chain so the facilitator cannot alter the deal.</span><span class="tech s">Hedera EVM</span></div>
    <div class="arow" data-reveal><span class="n">05</span><span class="nm">SELLER</span><span class="what">An ordinary x402 resource server — which runs the buyer&rsquo;s own checks on itself before answering, and may decline.</span><span class="tech s">x402</span></div>
    <div class="arow" data-reveal><span class="n">06</span><span class="nm">THE DATA</span><span class="what">Holdings from the Token API, pools from the Subgraph gateway. <b>This is what is being bought.</b></span><span class="tech s">The Graph</span></div>
    <div class="arow" data-reveal><span class="n">07</span><span class="nm">ADJUDICATOR</span><span class="what">A pure function of (terms, response). Seven checks decide the money; latency is attested and decides nothing.</span><span class="tech none">this project</span></div>
    <div class="arow" data-reveal><span class="n">08</span><span class="nm">AUDIT LOG</span><span class="what">Publishes the terms, the raw response and the verdict for every deal, in consensus order.</span><span class="tech s">Hedera HCS</span></div>
    <div class="arow" data-reveal><span class="n">09</span><span class="nm">ANYONE</span><span class="what">Replays all of it from the mirror node: the CLI, a zero-dependency Python verifier, or your own browser.</span><span class="tech s">Mirror Node</span></div>
    <div class="arow" data-reveal><span class="n">10</span><span class="nm">AGENTS</span><span class="what">A gateway and two Recipes, so an agent can use every one of these without knowing x402 exists.</span><span class="tech s">Bazantic</span></div>
  </div>`},

termScene('honest', 'the honest case — buying live token data from The Graph &nbsp;<b>pnpm buy honest</b>', 'honest', 'open', { needle: 'funds released', to: 'rel' }),

{ n:'verdict', dur:10000, enter:'cut', chip:'open', stamp:{at:6200, kind:'paid', text:'released to seller'}, state:'rel', html:`
  <h3>Seven checks decide the money. One is recorded and decides nothing.</h3>
  ${checkRows(D.verdicts?.honest)}
  <p style="margin-top:30px" data-stamp><span class="stamp paid">released to seller</span>
    <span style="margin-left:22px; color:var(--faded); font-size:17px">buyer delta −0.50000000 ℏ</span></p>`},

termScene('garbage', 'HTTP 200 with a useless body &nbsp;<b>pnpm buy garbage</b>', 'garbage', 'open', { needle: 'funds refunded', to: 'ref' }),

{ n:'refund', dur:11000, enter:'cut', chip:'open', stamp:{at:7000, kind:'returned', text:'returned to buyer'}, state:'ref', html:`
  <h3>Nothing at the HTTP layer was wrong. Status passed. The schema caught it.</h3>
  ${checkRows(D.verdicts?.garbage)}
  <p style="margin-top:26px" data-stamp><span class="stamp returned">returned to buyer</span>
    <span style="margin-left:22px; color:var(--faded); font-size:17px">refunded in seconds — no human, no evaluator, no dispute</span></p>`},

termScene('stale', 'well-formed, correct, and stale — only freshness catches it &nbsp;<b>pnpm buy subtle</b>', 'subtle', 'open', { needle: 'funds refunded', to: 'ref' }),

termScene('declined', 'the seller runs the buyer&rsquo;s own checks first, and declines the sale &nbsp;<b>HTTP 409</b>', 'selfcheck', 'open', { needle: 'funds refunded', to: 'ref' }),

termScene('expired', 'the seller never answers — a stranger recovers the funds &nbsp;<b>pnpm claim</b>', 'dead', 'open', { needle: 'deal is now Refunded', to: 'ref' }),

termScene('replay', 'replaying every verdict on the public log &nbsp;<b>pnpm verify --all</b>', 'verifyAll', null),

termScene('second impl', 'a second implementation, sharing no code with the first &nbsp;<b>python3 verify.py</b>', 'python', null),

{ n:'evidence', dur:24000, beats:[6000, 12000, 24000], runBeat:2,
  focus:{ 0:{ x:11, y:-34, scale:1.85, at:0.40, over:0.34 },
          1:{ x:-14, y:-12, scale:1.80, at:0.40, over:0.34 } }, html:`
  <h3 style="max-width:62ch; margin-bottom:18px">Every figure in this film is on a public ledger. Here is where to find it.</h3>
  <div class="shot">
    <div class="frame">
      <img data-shot="0" src="shots/tx-release.png" alt="the release transaction on HashScan">
      <img data-shot="1" src="shots/topic-messages.png" alt="the audit topic messages on HashScan">
      ${runFrames}
    </div>
    <p class="cap" data-cap="0"><b>release()</b> on HashScan — 0.50000000 ℏ leaves the escrow contract for the seller</p>
    <p class="cap" data-cap="1"><b>the audit log</b> — terms, the raw response and the verdict, published for every deal</p>
    <p class="cap" data-cap="2"><b>a real session</b> — one press, and every link is a transaction that just happened</p>
  </div>`},

{ n:'conform', dur:9000, html:`
  <h2 class="wide">Two implementations. Same verdicts, same hashes.</h2>
  <p class="lede">The Python verifier is 600 lines with no dependencies — its own keccak, its own JCS canonicaliser, written from SPEC.md rather than from the TypeScript. If the spec were ambiguous these would disagree.</p>
  <div class="term" style="background:var(--term-bg); color:var(--term-fg); padding:22px 26px; margin-top:24px; font-size:15px; max-width:92ch" data-static="conformance"></div>`},

{ n:'sponsors', dur:13000, html:`
  <h3 style="max-width:60ch">Where each sponsor technology actually carries weight.</h3>
  <table>
    <tr><th>sponsor</th><th>what it does here</th><th>evidence</th></tr>
    <tr><td class="who">The Graph</td><td><b>This is what is being bought.</b> Two products composed: Token API for holdings, Subgraph gateway for the pools. The terms name both, and require a snapshot indexed past a stated block.</td><td class="ev"><span class="ok">live</span> — 1897-byte<br>response on HCS</td></tr>
    <tr><td class="who">Hedera</td><td>Escrow holds real HBAR between payment and verdict. HCS carries terms, raw response and verdict — without it, “re-run it yourself” is a slogan rather than a command.</td><td class="ev"><span class="ok">live</span> — 0x3483…4071<br>topic 0.0.10495465</td></tr>
    <tr><td class="who">Blocky402</td><td>Performs every real payment. The buyer signs a <b>partial</b> transfer; Blocky402 adds the fee-payer signature and submits it.</td><td class="ev"><span class="ok">live</span> — buyer pays<br>zero gas</td></tr>
    <tr><td class="who">Bazantic</td><td>Gateway over the facilitator, plus two published Recipes — one of them chains Receipt and 1inch, so a swap is only ever priced against holdings that passed their checks.</td><td class="ev"><span class="ok">live</span> — 2 recipes<br>published</td></tr>
  </table>`},

{ n:'limits', dur:11000, html:`
  <h2 class="wide">Latency is our own stopwatch. So it gates nothing.</h2>
  <p class="lede">The verdict splits in two. <b>reproducible[]</b> decides where the money goes and anyone can recompute it. <b>attested[]</b> is recorded, shown, and decides nothing.
  Publishing the raw response is what makes verification real — and is wrong for a business selling data. A confidential enclave is the fix, and it is not built.
  The facilitator also custodies for one hop; both legs are on the public log, and <code>open()</code> verifies the buyer's signature on-chain so it cannot alter the deal it was handed.</p>`},

{ n:'close', dur:9000, enter:'cut', html:`
  <div style="padding-right:60px">
    <h2 class="wide" data-in="150" style="margin-bottom:22px">x402 has no refund primitive.</h2>
    <h2 class="wide" data-in="1100" style="margin-bottom:22px">The shipped alternative appoints an evaluator, and runs at five senders a day.</h2>
    <h2 class="wide" data-in="2300" style="color:var(--paid)">Receipt has no evaluator, because the verdict is a pure function anyone can recompute.</h2>
    <p data-in="3600" style="margin-top:40px; color:var(--faded); font-size:17px">github.com/Thirumurugan7/Receipt</p>
  </div>`},

];

// terminal scenes get their duration from how much there is to read
const TERM_DUR = { honest:21000, garbage:13000, subtle:12000, selfcheck:13000, dead:13000,
                   verifyAll:15000, python:14000 };
for (const s of SCENES) if (s.type) s.dur = TERM_DUR[s.type] ?? 16000;

const TOTAL_MS = SCENES.reduce((a, s) => a + s.dur, 0);
const starts = [];
SCENES.reduce((acc, s, i) => { starts[i] = acc; return acc + s.dur }, 0);

const stage = document.getElementById('stage');
const rail = document.getElementById('rail');
const bar = document.getElementById('bar');
const railNum = rail.querySelector('.num');
const railNm = rail.querySelector('.nm');
const railState = rail.querySelector('.state');
const railClock = rail.querySelector('.clock');

SCENES.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'scene' + (s.dark ? ' dark' : '');
  el.innerHTML = `<div class="inner">${s.html}</div>`;
  stage.appendChild(el);
  const st = el.querySelector('[data-static]');
  if (st) st.innerHTML = paint(D[st.dataset.static] ?? '');
});

const ENTER_MS = 420;
const mmss = (ms) => {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};

/**
 * The whole film, as a function of the clock. Returns a signature of the
 * state it painted: the renderer skips capturing frames whose signature has
 * not changed, which is why a static slide costs one screenshot rather than
 * three hundred.
 */
function seek(ms){
  const t = clamp(ms, 0, TOTAL_MS);
  let i = SCENES.length - 1;
  while (i > 0 && t < starts[i]) i--;
  const s = SCENES[i];
  const st = t - starts[i];

  const kids = stage.children;
  for (let j = 0; j < kids.length; j++) kids[j].classList.toggle('on', j === i);
  document.body.dataset.dark = s.dark ? '1' : '0';

  /*
   * Scenes do not all arrive the same way. A cut lands hard on a verdict; a
   * push carries momentum out of a transcript; a rise is the resting default.
   * Same clock, different gesture -- which is most of what makes an edit read
   * as edited rather than as a slideshow on a timer.
   */
  const inner = kids[i].firstElementChild;
  const enter = s.enter ?? 'rise';
  let e = 1;
  if (enter === 'cut') {
    inner.style.transform = 'none';
    inner.style.opacity = '1';
  } else if (enter === 'push') {
    e = easeInOut(st / 480);
    inner.style.transform = `translateX(${(1 - e) * 46}px)`;
    inner.style.opacity = String(clamp(st / 260, 0, 1));
  } else {
    e = easeOut(st / ENTER_MS);
    inner.style.transform = `translateY(${(1 - e) * 22}px)`;
    inner.style.opacity = String(e);
  }

  const sig = [i, enter === 'cut' ? 1 : Math.round(e * 100)];

  /*
   * Anything with data-in arrives at its own moment. Choreographing the parts
   * separately is the difference between a slide appearing and a slide being
   * built in front of you.
   */
  const timed = kids[i].querySelectorAll('[data-in]');
  if (timed.length) {
    let acc = 0;
    for (const el of timed) {
      const at = Number(el.dataset.in);
      const p = easeBack((st - at) / 420);
      const o = clamp((st - at) / 280, 0, 1);
      el.style.opacity = String(o);
      el.style.transform = st >= at + 420 ? 'none' : `translateY(${(1 - p) * 13}px)`;
      acc += Math.round(o * 20);
    }
    sig.push('t' + acc);
  }
  let flipAtMs = null;   // when the transcript printed the line where the money moves

  const term = kids[i].querySelector('.term[data-k]');
  if (term) {
    const text = D[term.dataset.k] ?? '';
    const printMs = s.dur * 0.66;
    const chars = Math.floor(clamp(st / printMs, 0, 1) * text.length);
    const blink = st < printMs || Math.floor(t / 530) % 2 === 0;
    // Paint, then lift the last line: nothing in paint() spans a newline, so
    // the painted HTML can be split on one safely.
    const painted = paint(text.slice(0, chars)).split('\n');
    const printing = chars < text.length && painted.length > 0;
    if (printing) painted[painted.length - 1] = `<span class="live">${painted[painted.length - 1]}</span>`;
    term.innerHTML = painted.join('\n') + (blink ? '<span class="cur"></span>' : '');

    // A slow drift while it fills. Anchored top-left so the text cannot walk
    // out of the frame, and small enough that it reads as life rather than
    // as a zoom.
    const dr = easeInOut(clamp(st / s.dur, 0, 1));
    term.style.transform = `translateY(${(-5 * dr).toFixed(2)}px) scale(${(1 + 0.012 * dr).toFixed(4)})`;

    // Once the transcript has finished printing, light up the verdict line.
    // Without it the eye has to hunt for the one line the scene is about.
    const sweep = Math.round(easeOut((st - printMs - 260) / 520) * 100);
    term.style.setProperty('--sweep', `${sweep}%`);

    sig.push(chars, blink ? 1 : 0, sweep, Math.round(dr * 60));

    if (s.flip) {
      const at = text.indexOf(s.flip.needle);
      // when, in scene time, the money-moving line finished printing
      if (at !== -1) flipAtMs = ((at + s.flip.needle.length) / text.length) * printMs;
    }
  }

  // checks tick down one at a time, then the stamp lands once
  // Several captures in one scene, with their own lengths: two stills to read,
  // then a recorded session played back.
  if (s.beats) {
    let idx = s.beats.findIndex((end) => st < end);
    if (idx === -1) idx = s.beats.length - 1;
    const from = idx === 0 ? 0 : s.beats[idx - 1];
    const u = (st - from) / (s.beats[idx] - from);
    const into = easeOut((st - from) / 260);

    /*
     * Hold the whole page long enough to see what it is, then push in on the
     * line that carries the claim. A full-page screenshot held flat for six
     * seconds is a slide; moving to the evidence is an edit -- and it makes
     * the small print legible, which matters more.
     */
    const focus = s.focus?.[idx];
    let fx = '';
    if (focus) {
      const k = easeInOut((u - focus.at) / focus.over);
      const z = 1 + (focus.scale - 1) * k;
      fx = `scale(${z.toFixed(3)}) translate(${(focus.x * k).toFixed(2)}%, ${(focus.y * k).toFixed(2)}%)`;
    }
    for (const img of kids[i].querySelectorAll('[data-shot]')) {
      const on = Number(img.dataset.shot) === idx;
      img.style.opacity = on ? String(into) : '0';
      img.style.transform = on && fx ? fx : 'none';
    }
    if (focus) sig.push('f' + Math.round(easeInOut((u - focus.at) / focus.over) * 100));

    // On the run beat, play the captured frames; otherwise hide them all.
    const runIdx = idx === s.runBeat
      ? Math.min(RUN_FRAMES - 1, Math.floor(u * RUN_FRAMES))
      : -1;
    for (const img of kids[i].querySelectorAll('[data-run]')) {
      img.style.opacity = Number(img.dataset.run) === runIdx ? String(into) : '0';
    }

    for (const cap of kids[i].querySelectorAll('[data-cap]')) {
      cap.style.opacity = Number(cap.dataset.cap) === idx ? String(into) : '0';
    }
    sig.push('b' + idx, runIdx, Math.round(into * 100));
  }

  const rows = kids[i].querySelectorAll('[data-reveal]');
  if (rows.length) {
    const per = s.revealMs ?? 520;
    const shown = clamp(Math.floor((st - 350) / per) + 1, 0, rows.length);
    rows.forEach((r, j) => { r.style.opacity = j < shown ? '1' : '0' });
    sig.push(shown);
  }

  const stampEl = kids[i].querySelector('[data-stamp]');
  if (stampEl && s.stamp) {
    const p = easeOut((st - s.stamp.at) / 320);
    const vis = st >= s.stamp.at;
    stampEl.style.opacity = vis ? '1' : '0';
    const inner2 = stampEl.querySelector('.stamp');
    const scale = vis ? 1 + (1 - p) * 0.38 : 1.38;
    const rot = vis ? -3 * p : 0;
    inner2.style.transform = `rotate(${rot.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
    sig.push(vis ? Math.round(p * 100) : -1);
  }

  railNum.textContent = `${String(i + 1).padStart(2, '0')}/${SCENES.length}`;
  railNm.textContent = s.n;
  const flipped = flipAtMs !== null && st >= flipAtMs;
  const changedAt = s.state ? (s.stamp?.at ?? 0) : (flipped ? flipAtMs : null);
  const settledTo = (s.state && st >= (s.stamp?.at ?? 0)) ? s.state
    : (flipped ? s.flip.to : null);
  const chip = settledTo
    ? `<span class="chip ${settledTo}">${settledTo === 'rel' ? 'RELEASED' : 'REFUNDED'}</span>`
    : ((s.chip || s.state) ? `<span class="chip open">ESCROW OPEN</span>` : '');
  railState.innerHTML = chip;
  // The state of the money changing is the point of the whole scene, so the
  // chip lands rather than merely swapping.
  const pop = settledTo && changedAt !== null
    ? 1 + (1 - easeBack(clamp((st - changedAt) / 300, 0, 1))) * 0.45
    : 1;
  const chipEl = railState.firstElementChild;
  if (chipEl) chipEl.style.transform = `scale(${pop.toFixed(3)})`;
  sig.push(Math.round(pop * 100));
  railClock.textContent = `${mmss(t)} / ${mmss(TOTAL_MS)}`;
  bar.style.width = `${(t / TOTAL_MS) * 100}%`;
  sig.push(Math.floor(t / 1000), settledTo ?? '-');

  return sig.join('|');
}

window.seek = seek;
window.TOTAL_MS = TOTAL_MS;
/** The running order, so the narration script can be checked against it. */
window.SCHEDULE = SCENES.map((s, i) => ({ n: s.n, start: starts[i], dur: s.dur }));

// Watching it in a browser drives the same pure function off the wall clock.
if (!location.hash.includes('render')) {
  const t0 = performance.now();
  const frame = (now) => {
    const t = now - t0;
    seek(t);
    if (t < TOTAL_MS) requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
} else {
  seek(0);
}
</script>
</body>
</html>
